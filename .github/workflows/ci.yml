name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos y pruebas unitarias
        run: |
          npm run typecheck
          npm test
      - name: Compilación
        run: npm run build
      - name: Navegador para las pruebas de extremo a extremo
        run: npx playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo (celular y computadora)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados
          path: |
            tests/.artifacts/
            test-results/
          retention-days: 7
